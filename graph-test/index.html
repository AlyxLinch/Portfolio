<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Interactive squircle graph test with live axis scale and curve controls."
    >
    <title>Squircle Graph Test</title>
    <link rel="stylesheet" href="/shared/design-system.css">
    <link rel="stylesheet" href="/graph-test/graph.css">
  </head>
  <body>
    <main class="graph-page">
      <section class="graph-shell">
        <header class="graph-header">
          <p class="ds-label">Parametric squircle test</p>
          <h1 class="ds-display ds-display--title ds-gradient-text ds-gradient-text--yellow">
            <span id="function-label">|x / 6|⁴ + |y / 6|⁴ = 1</span>
          </h1>
        </header>

        <section class="graph-card ds-paper" aria-label="Interactive squircle graph">
          <canvas id="graph-canvas" width="960" height="960" aria-label="Graph of a centered squircle"></canvas>
        </section>

        <section class="controls-card ds-glass" aria-label="Graph controls">
          <label class="control-row">
            <span>
              <strong>Axis scale</strong>
              <small>Zoom x and y together</small>
            </span>
            <input id="scale-slider" type="range" min="4" max="24" value="12" step="0.5">
            <output id="scale-output">12.0</output>
          </label>

          <label class="control-row">
            <span>
              <strong>Squircle exponent</strong>
              <small>Move from circular to square</small>
            </span>
            <input id="coefficient-slider" type="range" min="2" max="12" value="4" step="0.1">
            <output id="coefficient-output">4.0</output>
          </label>
        </section>
      </section>
    </main>

    <script type="module" src="/graph-test/graph.js"></script>
  </body>
</html>
