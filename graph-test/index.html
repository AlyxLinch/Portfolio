<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Interactive animated squircle test with configurable exponent values and duration."
    >
    <title>Squircle Graph Test</title>
    <link rel="stylesheet" href="/shared/design-system.css">
    <link rel="stylesheet" href="/graph-test/graph.css">
  </head>
  <body>
    <main class="graph-page">
      <section class="graph-shell">
        <header class="graph-header">
          <p class="ds-label">Parametric squircle test</p>
          <h1 class="ds-display ds-display--title ds-gradient-text ds-gradient-text--yellow">
            <span id="function-label">|x|ⁿ + |y|ⁿ = 1 · n = 4.0</span>
          </h1>
        </header>

        <section class="graph-card ds-paper" aria-label="Interactive squircle graph">
          <canvas id="graph-canvas" width="960" height="960" aria-label="Graph of a centered squircle"></canvas>
        </section>

        <section class="controls-card ds-glass" aria-label="Graph controls">
          <label class="control-row">
            <span>
              <strong>Starting exponent</strong>
              <small>Initial squircle shape</small>
            </span>
            <input id="start-exponent" type="number" min="2" max="20" value="4" step="0.1">
          </label>

          <label class="control-row">
            <span>
              <strong>Ending exponent</strong>
              <small>Final squircle shape</small>
            </span>
            <input id="end-exponent" type="range" min="2" max="20" value="12" step="0.1">
            <output id="end-exponent-output">12.0</output>
          </label>

          <label class="control-row">
            <span>
              <strong>Duration</strong>
              <small>Seconds from start to end</small>
            </span>
            <input id="duration-input" type="number" min="0.25" max="30" value="4" step="0.25">
          </label>

          <div class="play-control">
            <button id="play-toggle" class="play-toggle" type="button" aria-pressed="false">
              <span class="play-toggle__icon" aria-hidden="true">▶</span>
              <span class="play-toggle__label">Play</span>
            </button>
            <output id="animation-status" aria-live="polite">Ready · 4.0</output>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/graph-test/graph.js"></script>
  </body>
</html>
