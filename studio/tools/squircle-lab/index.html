<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Interactive animated squircle test with configurable exponent values and duration."
    >
    <title>Squircle Graph Test</title>
    <link rel="stylesheet" href="/shared/design-system.css">
    <link rel="stylesheet" href="/studio/tools/squircle-lab/graph.css">
  </head>
  <body>
    <main class="graph-page">
      <section class="graph-shell">
        <header class="graph-header">
          <p class="ds-label">Parametric squircle test</p>
          <h1 class="ds-display ds-display--title ds-gradient-text ds-gradient-text--yellow">
            <span id="function-label">Square corner model × 4 · n = 11.0</span>
          </h1>
        </header>

        <section class="graph-card ds-paper" aria-label="Interactive squircle button studies">
          <div class="button-stage">
            <button class="shape-button shape-button--square" type="button" data-border-width="0">
              <svg class="shape-button__graphic" aria-hidden="true">
                <path class="shape-button__surface"></path>
              </svg>
              <span class="shape-button__copy">View<br>work</span>
            </button>

            <button class="shape-button shape-button--landscape" type="button" data-border-width="1">
              <svg class="shape-button__graphic" aria-hidden="true">
                <path class="shape-button__surface"></path>
              </svg>
              <span class="shape-button__copy">Explore process</span>
            </button>

            <button class="shape-button shape-button--wide" type="button" data-border-width="1">
              <svg class="shape-button__graphic" aria-hidden="true">
                <path class="shape-button__surface"></path>
              </svg>
              <span class="shape-button__copy">Read the case study <span aria-hidden="true">↗</span></span>
            </button>

            <button class="shape-button shape-button--portrait" type="button" data-border-width="1">
              <svg class="shape-button__graphic" aria-hidden="true">
                <path class="shape-button__surface"></path>
              </svg>
              <span class="shape-button__copy">Start a<br>project</span>
            </button>
          </div>
        </section>

        <section class="controls-card ds-glass" aria-label="Graph controls">
          <label class="control-row">
            <span>
              <strong>Starting exponent</strong>
              <small>Initial squircle shape</small>
            </span>
            <input id="start-exponent" type="range" min="2" max="20" value="11" step="0.1">
            <output id="start-exponent-output">11.0</output>
          </label>

          <div class="control-row">
            <span>
              <strong>Ending exponent</strong>
              <small>Calculated per button</small>
            </span>
            <output id="end-exponent-output" class="calculated-value">Calculating...</output>
          </div>

          <div class="control-row interpolation-control">
            <span>
              <strong>Interpolation style</strong>
              <small>Shape the animation timing</small>
            </span>
            <div id="interpolation-dropdown" class="ds-dropdown" data-dropdown>
              <button class="ds-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span data-dropdown-value>Ease in</span>
              </button>
              <div class="ds-dropdown__menu" role="listbox" aria-label="Interpolation style">
                <button class="ds-dropdown__option" type="button" role="option" data-style="linear" aria-selected="false">Linear</button>
                <button class="ds-dropdown__option" type="button" role="option" data-style="ease-in" aria-selected="true">Ease in</button>
                <button class="ds-dropdown__option" type="button" role="option" data-style="ease-out" aria-selected="false">Ease out</button>
                <button class="ds-dropdown__option" type="button" role="option" data-style="ease-in-out" aria-selected="false">Ease in-out</button>
              </div>
            </div>
          </div>

          <label class="control-row">
            <span>
              <strong>FPS</strong>
              <small>Exponent updates per second</small>
            </span>
            <input id="fps-input" type="number" min="1" max="1000" value="60" step="1" inputmode="numeric">
          </label>

          <label class="control-row">
            <span>
              <strong>Duration</strong>
              <small>Seconds in each direction</small>
            </span>
            <input id="duration-input" type="number" min="0.25" max="30" value="0.5" step="0.25">
          </label>
        </section>
      </section>
    </main>

    <script type="module" src="/studio/tools/squircle-lab/graph.js"></script>
  </body>
</html>
