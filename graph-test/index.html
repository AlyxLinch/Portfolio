<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Interactive reciprocal graph test with live quadrant, axis, and coefficient controls."
    >
    <title>Reciprocal Graph Test</title>
    <link rel="stylesheet" href="/shared/design-system.css">
    <link rel="stylesheet" href="/graph-test/graph.css">
  </head>
  <body>
    <main class="graph-page">
      <section class="graph-shell">
        <header class="graph-header">
          <p class="ds-label">Reciprocal quadrant test</p>
          <h1 class="ds-display ds-display--title ds-gradient-text ds-gradient-text--yellow">
            <span id="function-label">QIV · y = -1.00 / x</span>
          </h1>
        </header>

        <section class="graph-card ds-paper" aria-label="Interactive reciprocal graph">
          <canvas id="graph-canvas" width="960" height="960" aria-label="Graph of a reciprocal function in one selected quadrant"></canvas>
        </section>

        <section class="controls-card ds-glass" aria-label="Graph controls">
          <div class="control-row control-row--quadrants">
            <span>
              <strong>Quadrant</strong>
              <small>Reflect the curve into view</small>
            </span>
            <div class="quadrant-toggle" role="group" aria-label="Choose graph quadrant">
              <button class="quadrant-button" type="button" data-quadrant="1" aria-pressed="false">I</button>
              <button class="quadrant-button" type="button" data-quadrant="2" aria-pressed="false">II</button>
              <button class="quadrant-button" type="button" data-quadrant="3" aria-pressed="false">III</button>
              <button class="quadrant-button is-active" type="button" data-quadrant="4" aria-pressed="true">IV</button>
            </div>
            <output id="quadrant-output">QIV</output>
          </div>

          <label class="control-row">
            <span>
              <strong>Axis scale</strong>
              <small>Zoom x and y together</small>
            </span>
            <input id="scale-slider" type="range" min="4" max="24" value="12" step="0.5">
            <output id="scale-output">12.0</output>
          </label>

          <label class="control-row">
            <span>
              <strong>Coefficient</strong>
              <small>Adjust curve depth</small>
            </span>
            <input id="coefficient-slider" type="range" min="0.1" max="5" value="1" step="0.05">
            <output id="coefficient-output">1.00</output>
          </label>
        </section>
      </section>
    </main>

    <script type="module" src="/graph-test/graph.js"></script>
  </body>
</html>
